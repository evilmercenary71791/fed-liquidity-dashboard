name: Refresh Federal Reserve H.4.1 data
on:
  schedule:
    - cron: '15 12 * * 5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and validate Wednesday H.4.1 series
        run: python update_data.py
      - name: Commit updated dataset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/weekly.csv data/status.json data/money_supply.csv data/money_status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh H.4.1 data'
            git push
          fi
